name: vlog

on:
  push:
    branches:
      - main
    paths:
      - 'packages/vlog/**'
      - '.github/workflows/vlog.yml'
  pull_request:
    paths:
      - 'packages/vlog/**'
      - '.github/workflows/vlog.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/vlog
    shell: bash

jobs:
  tests:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }} (${{ matrix.suite }})
    runs-on: ${{ matrix.os }}

    # "core" runs the framework-independent tests only. "laravel" also runs the
    # Laravel adapter tests against the newest Laravel that installs on that PHP
    # version. Composer blocks Laravel versions with known security advisories,
    # so the Laravel tests start at PHP 8.2.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, php: '7.4', suite: core }
          - { os: ubuntu-latest, php: '8.0', suite: core }
          - { os: ubuntu-latest, php: '8.1', suite: core }
          - { os: ubuntu-latest, php: '8.2', suite: laravel }
          - { os: ubuntu-latest, php: '8.3', suite: laravel }
          - { os: ubuntu-latest, php: '8.4', suite: laravel }
          - { os: ubuntu-latest, php: '8.5', suite: laravel }
          - { os: windows-latest, php: '7.4', suite: core }
          - { os: windows-latest, php: '8.5', suite: laravel }

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Remove Laravel test tools
        if: matrix.suite == 'core'
        run: composer remove --dev orchestra/testbench --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run core tests
        if: matrix.suite == 'core'
        run: vendor/bin/pest --testsuite=Unit

      - name: Run all tests
        if: matrix.suite == 'laravel'
        run: vendor/bin/pest

  quality:
    name: Static analysis and code style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan on the core
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run PHPStan on the framework adapters
        run: vendor/bin/phpstan analyse -c phpstan.adapters.neon --memory-limit=1G --no-progress

      - name: Check code style
        run: |
          composer global require laravel/pint --no-interaction --no-progress
          "$(composer global config bin-dir --absolute --quiet)/pint" --test
