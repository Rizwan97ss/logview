name: vlog

on:
  push:
    branches:
      - main
    paths:
      - 'packages/vlog/**'
      - '.github/workflows/vlog.yml'
  pull_request:
    paths:
      - 'packages/vlog/**'
      - '.github/workflows/vlog.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/vlog
    shell: bash

jobs:
  tests:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        include:
          - os: windows-latest
            php: '7.4'
          - os: windows-latest
            php: '8.5'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: vendor/bin/pest

  quality:
    name: Static analysis and code style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Check code style
        run: |
          composer global require laravel/pint --no-interaction --no-progress
          "$(composer global config bin-dir --absolute --quiet)/pint" --test
